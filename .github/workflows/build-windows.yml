name: Build Windows .exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build React app
      run: npm run build
    
    - name: Build Windows .exe
      run: npm run electron:build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: CrossCAD-Windows
        path: |
          dist/CrossCAD Setup 2.0.0.exe
          dist/CrossCAD-2.0.0-portable.exe
        retention-days: 30
